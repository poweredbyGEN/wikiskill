when:
  - event: push
  - event: pull_request

steps:
  check:
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - pip install pytest==9.1.1 ruff==0.16.5
      - ruff check src tests
      - ruff format --check src tests
      - pytest -q
